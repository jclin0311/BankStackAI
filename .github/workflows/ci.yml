name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/bankstack/<service>:<sha>
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/bankstack

jobs:
  # Works out which services a push actually affects. A service is affected by its own
  # directory and by the commons libraries it consumes — those are versioned jars, so a
  # change there silently alters every dependent and must rebuild them.
  changes:
    name: Detect affected services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
      shared: ${{ steps.filter.outputs.shared }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            auth-user:
              - 'AuthUser/**'
              - 'commons-dto/**'
              - 'commons-security/**'
              - 'commons-observability/**'
            customer-service:
              - 'CusomerService/**'
              - 'commons-dto/**'
              - 'commons-security/**'
              - 'commons-observability/**'
            account-service:
              - 'AccountService/**'
              - 'commons-dto/**'
              - 'commons-security/**'
              - 'commons-observability/**'
            biller-service:
              - 'BillerService/**'
              - 'commons-dto/**'
              - 'commons-security/**'
              - 'commons-observability/**'
            payment-orchestrator:
              - 'PaymentOrchestrator/**'
              - 'commons-dto/**'
              - 'commons-security/**'
              - 'commons-observability/**'
            billpay-worker:
              - 'BillPayWorkerService/**'
              - 'commons-dto/**'
              - 'commons-security/**'
              - 'commons-observability/**'
            settlement-service:
              - 'SettlementService/**'
              - 'commons-dto/**'
            mcp-server:
              - 'BankStackMCPServer/**'
              - 'commons-dto/**'
              - 'commons-security/**'
            rag-service:
              - 'BankStackRag/**'
              - 'commons-security/**'
            multi-agent:
              - 'BankStackMultiAgent/**'
              - 'commons-dto/**'
              - 'commons-security/**'
            shared:
              - 'commons-dto/**'
              - 'commons-security/**'
              - 'commons-observability/**'
              - 'BankStackEval/**'
            docs:
              - 'docs/**'

      # `changes` also carries the non-service filters; drop them so the matrix is
      # exactly the set of deployable services.
      - name: Select service matrix
        id: select
        run: |
          services=$(jq -c 'map(select(. != "docs" and . != "shared"))' <<<'${{ steps.filter.outputs.changes }}')
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Affected services: $services"

  # Shared libraries have their own tests; a service build would not exercise them.
  shared-libs:
    name: Test shared libraries
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test commons + eval harness
        run: |
          set -euo pipefail
          for m in commons-dto commons-security commons-observability BankStackEval; do
            echo "::group::$m"
            (cd "$m" && mvn -B install)
            echo "::endgroup::"
          done

  build-test:
    name: Build & test ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    services:
      # Context-load tests for the JPA services need a reachable Postgres.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve module directory
        id: mod
        run: echo "dir=$(jq -r --arg s '${{ matrix.service }}' '.[$s]' .github/service-modules.json)" >> "$GITHUB_OUTPUT"

      - name: Create per-service databases
        run: PGPASSWORD=postgres psql -h localhost -U postgres -f postgres-init.sql

      # The commons jars are consumed from the local repository, so they have to be
      # installed before any single service can compile.
      - name: Install shared libraries
        run: |
          set -euo pipefail
          for m in commons-dto commons-security commons-observability; do
            (cd "$m" && mvn -B -q install -DskipTests)
          done

      - name: Build and test ${{ matrix.service }}
        run: cd "${{ steps.mod.outputs.dir }}" && mvn -B package
        env:
          # Dummy Auth0 credentials so the AuthUser / PaymentOrchestrator context
          # tests can start without real secrets.
          AUTH0_MGMT_CLIENT_ID: ci-dummy
          AUTH0_MGMT_CLIENT_SECRET: ci-dummy
          AUTH0_M2M_CLIENT_ID: ci-dummy
          AUTH0_M2M_CLIENT_SECRET: ci-dummy

      - name: Upload jar
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.service }}
          retention-days: 1
          path: ${{ steps.mod.outputs.dir }}/target/*.jar

  images:
    name: Publish ${{ matrix.service }} image
    needs: [changes, build-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve module directory
        id: mod
        run: echo "dir=$(jq -r --arg s '${{ matrix.service }}' '.[$s]' .github/service-modules.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: jar-${{ matrix.service }}
          path: ${{ steps.mod.outputs.dir }}/target

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only affected services get a new tag, so each service's `latest` advances
      # independently of the rest of the system.
      - name: Build and push
        run: |
          set -euo pipefail
          image="${IMAGE_PREFIX}/${{ matrix.service }}"
          docker build -t "$image:${GITHUB_SHA::7}" -t "$image:latest" "${{ steps.mod.outputs.dir }}"
          docker push "$image:${GITHUB_SHA::7}"
          docker push "$image:latest"

  pages:
    name: Publish API reference
    needs: changes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # docs/api/*.json is committed, regenerated by ./dump-openapi.sh against a
      # running cluster. Booting all 10 services here just to re-dump them would
      # need Postgres, Kafka and Ollama, so it stays a deliberate local step.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5

  deploy:
    name: Deploy affected services
    needs: [changes, images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for kubeconfig secret
        id: kube
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG secret not set — skipping deploy." \
                 "For the local OrbStack cluster, deploy from your machine with:" \
                 "./build-images.sh && kubectl apply -k k8s/"
          fi

      - name: Configure kubectl
        if: steps.kube.outputs.available == 'true'
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # Roll only the services this push rebuilt; everything else keeps running the
      # image it was already on.
      - name: Roll affected deployments
        if: steps.kube.outputs.available == 'true'
        run: |
          set -euo pipefail
          for svc in $(jq -r '.[]' <<<'${{ needs.changes.outputs.services }}'); do
            kubectl -n bankstack set image "deployment/$svc" \
              "$svc=${IMAGE_PREFIX}/$svc:${GITHUB_SHA::7}"
            kubectl -n bankstack rollout status "deployment/$svc" --timeout=300s
          done
