name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/bankstack/<service>:<sha>
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/bankstack

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    services:
      # Context-load tests for the JPA services need a reachable Postgres.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Create per-service databases
        run: PGPASSWORD=postgres psql -h localhost -U postgres -f postgres-init.sql

      - name: Build all modules (shared libs first)
        run: ./build-all.sh

      - name: Run tests for every module
        run: |
          set -euo pipefail
          for m in commons-dto commons-security commons-observability \
                   CusomerService AccountService PaymentOrchestrator \
                   BillerService BillPayWorkerService SettlementService \
                   AuthUser BankStackMCPServer BankStackRag \
                   BankStackMultiAgent BankStackEval; do
            echo "::group::mvn test $m"
            (cd "$m" && mvn test -B)
            echo "::endgroup::"
          done
        env:
          # Dummy Auth0 credentials so the AuthUser / PaymentOrchestrator context
          # tests can start without real secrets.
          AUTH0_MGMT_CLIENT_ID: ci-dummy
          AUTH0_MGMT_CLIENT_SECRET: ci-dummy
          AUTH0_M2M_CLIENT_ID: ci-dummy
          AUTH0_M2M_CLIENT_SECRET: ci-dummy

      - name: Upload service jars
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          retention-days: 1
          path: |
            */target/*.jar
            !*/target/*sources*.jar

  images:
    name: Build & push images
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push service images
        run: |
          set -euo pipefail
          declare -A services=(
            [AuthUser]=auth-user
            [CusomerService]=customer-service
            [AccountService]=account-service
            [BillerService]=biller-service
            [PaymentOrchestrator]=payment-orchestrator
            [BillPayWorkerService]=billpay-worker
            [SettlementService]=settlement-service
            [BankStackMCPServer]=mcp-server
            [BankStackRag]=rag-service
            [BankStackMultiAgent]=multi-agent
          )
          for module in "${!services[@]}"; do
            image="${IMAGE_PREFIX}/${services[$module]}"
            docker build -t "$image:${GITHUB_SHA::7}" -t "$image:latest" "$module"
            docker push "$image:${GITHUB_SHA::7}"
            docker push "$image:latest"
          done

  pages:
    name: Publish API reference
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # docs/api/*.json is committed, regenerated by ./dump-openapi.sh against a
      # running cluster. Booting all 10 services here just to re-dump them would
      # need Postgres, Kafka and Ollama, so it stays a deliberate local step.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4

  deploy:
    name: Deploy to Kubernetes
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for kubeconfig secret
        id: kube
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG secret not set — skipping deploy." \
                 "For the local OrbStack cluster, deploy from your machine with:" \
                 "./build-images.sh && kubectl apply -k k8s/"
          fi

      - name: Configure kubectl
        if: steps.kube.outputs.available == 'true'
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Point manifests at the freshly pushed images
        if: steps.kube.outputs.available == 'true'
        run: |
          cd k8s
          for svc in auth-user customer-service account-service biller-service \
                     payment-orchestrator billpay-worker settlement-service \
                     mcp-server rag-service multi-agent; do
            kustomize edit set image "bankstack/${svc}=${IMAGE_PREFIX}/${svc}:${GITHUB_SHA::7}"
          done

      - name: Apply manifests
        if: steps.kube.outputs.available == 'true'
        run: |
          kubectl apply -k k8s/
          kubectl -n bankstack rollout status deployment --timeout=300s
