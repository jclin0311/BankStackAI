server:
  port: 8094

spring:
  application:
    name: auth-user

  security:
    oauth2:
      resourceserver:
        jwt:
          # Read by commons-security's DefaultSecurityConfig; the service cannot
          # start without it.
          issuer-uri: ${AUTH0_ISSUER_URI}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      INDENT_OUTPUT: false

cors:
  allowed-origins: "*"
  allowed-methods: "GET,POST"

auth0:
  domain: ${AUTH0_DOMAIN}
  audience: ${AUTH0_AUDIENCE}
  # Keys stay nested to match ManagementTokenService's ${auth0.mgmt.client-id};
  # a flat auth0.mgmt-client-id key does not resolve that placeholder.
  mgmt:
    client-id: ${AUTH0_MGMT_CLIENT_ID}
    client-secret: ${AUTH0_MGMT_CLIENT_SECRET}
    audience: ${AUTH0_DOMAIN}/api/v2/
