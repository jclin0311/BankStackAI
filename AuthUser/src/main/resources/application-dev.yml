     # Role name → Auth0 role id. Callers pass the name; ids are tenant-specific.
     roles:
       ROLE_CUSTOMER: ${AUTH0_ROLE_CUSTOMER_ID:rol_aQIIOMnJYsscxWpK}
       ROLE_ADMIN: ${AUTH0_ROLE_ADMIN_ID:rol_BexXCyPfzbc1tZfa}